<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Notes — From Sand to Superintelligence</title>
<meta name="description" content="All your margin notes across all 42 chapters of From Sand to Superintelligence. Filter by type, jump back to source paragraphs, or export as Markdown.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%231f4a6b' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%23a04a1a'/%3E%3C/svg%3E">
<style>
  /* Notes aggregation page styles */
  .notes-page { max-width: 800px; margin: 0 auto; padding: var(--space-8) var(--space-5) var(--space-20); }

  .notes-header { margin-bottom: var(--space-8); }
  .notes-header__crumb { font-size: var(--text-xs); font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: var(--space-3); }
  .notes-header__crumb a { color: inherit; text-decoration: none; }
  .notes-header__crumb a:hover { color: var(--color-text); }
  .notes-header__title { font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 500; color: var(--color-text); letter-spacing: -0.02em; margin: 0 0 var(--space-2); }
  .notes-header__dek { color: var(--color-text-muted); font-size: var(--text-base); margin: 0; }

  .notes-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    flex-wrap: wrap;
    margin-bottom: var(--space-6);
    padding-bottom: var(--space-5);
    border-bottom: 1px solid var(--color-divider);
  }

  .notes-filters {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .notes-filter {
    padding: 6px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    background: none;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    transition: all 0.15s ease;
  }

  .notes-filter:hover { border-color: var(--color-accent-copper); color: var(--color-text); }

  .notes-filter--active {
    background: var(--color-accent-copper);
    border-color: var(--color-accent-copper);
    color: #fff;
  }

  .notes-filter[data-filter="question"].notes-filter--active  { background: #1f4a6b; border-color: #1f4a6b; }
  .notes-filter[data-filter="analogy"].notes-filter--active   { background: #5b3a8a; border-color: #5b3a8a; }
  .notes-filter[data-filter="stuck"].notes-filter--active     { background: var(--color-accent-plasma); border-color: var(--color-accent-plasma); }
  .notes-filter[data-filter="got-it"].notes-filter--active    { background: #2a7a4b; border-color: #2a7a4b; }

  .notes-export {
    background: none;
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

  .notes-export:hover { border-color: var(--color-accent-copper); color: var(--color-text); }

  .notes-count {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-muted);
  }

  /* Chapter groups */
  .notes-chapter {
    margin-bottom: var(--space-10);
  }

  .notes-chapter__heading {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
    padding-bottom: var(--space-3);
    border-bottom: 1px solid var(--color-divider);
  }

  .notes-chapter__num {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-accent-copper);
    flex-shrink: 0;
  }

  .notes-chapter__title {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: 500;
    color: var(--color-text);
    margin: 0;
  }

  .notes-chapter__link {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    text-decoration: none;
    transition: color 0.15s ease;
    flex-shrink: 0;
  }

  .notes-chapter__link:hover { color: var(--color-accent-copper); }

  /* Individual note cards */
  .notes-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .note-card {
    display: flex;
    gap: var(--space-4);
    padding: var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    border-left: 3px solid var(--color-accent-copper);
  }

  .note-card:hover {
    border-color: var(--color-accent-copper);
    box-shadow: 0 2px 12px color-mix(in oklab, var(--color-text) 8%, transparent);
  }

  .note-card[data-type="question"] { border-left-color: #1f4a6b; }
  .note-card[data-type="analogy"]  { border-left-color: #5b3a8a; }
  .note-card[data-type="stuck"]    { border-left-color: var(--color-accent-plasma); }
  .note-card[data-type="got-it"]   { border-left-color: #2a7a4b; }

  .note-card__icon {
    font-size: 20px;
    flex-shrink: 0;
    line-height: 1.4;
  }

  .note-card__body { flex: 1; min-width: 0; }

  .note-card__type {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    margin-bottom: var(--space-1);
  }

  .note-card__text {
    font-size: var(--text-sm);
    color: var(--color-text);
    line-height: 1.55;
    margin: 0 0 var(--space-2);
  }

  .note-card__para {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--color-text-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .note-card__jump {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    color: var(--color-text-muted);
    font-size: 18px;
    transition: color 0.15s ease, transform 0.15s ease;
    align-self: center;
  }

  .note-card:hover .note-card__jump { color: var(--color-accent-copper); transform: translateX(3px); }

  /* Empty state */
  .notes-empty {
    text-align: center;
    padding: var(--space-16) var(--space-5);
    color: var(--color-text-muted);
  }

  .notes-empty__icon { font-size: 48px; margin-bottom: var(--space-4); }
  .notes-empty__title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 500; color: var(--color-text); margin: 0 0 var(--space-2); }
  .notes-empty__text  { font-size: var(--text-sm); max-width: 45ch; margin: 0 auto var(--space-6); }
  .notes-empty__cta {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: 10px 24px;
    background: var(--color-accent-copper);
    color: #fff;
    border-radius: var(--radius-full);
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: filter 0.15s ease;
  }
  .notes-empty__cta:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<div class="progress-bar"><div class="progress-bar__fill" data-progress-fill></div></div>
<header class="site-header" data-header>
  <div class="site-header__inner">
    <a class="brand" href="../index.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="3" fill="currentColor" />
        <path d="M12 3 L12 6 M12 18 L12 21 M3 12 L6 12 M18 12 L21 12" stroke-width="1" />
      </svg>
      <span>From Sand to Superintelligence<span class="brand__sub"> — a visual journey</span></span>
    </a>
    <span class="nav-spacer"></span>
    <a class="nav-link" href="../index.html">Cover</a>
    <a class="nav-link nav-link--active" href="../index.html#chapters">Chapters</a>
    <a class="nav-link" href="../chapters/glossary.html">Reference</a>
    <button class="icon-btn" data-search-open aria-label="Search the book (⌘K)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    </button>
    <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"></button>
  </div>
</header>

<main class="notes-page" id="notes-main">
  <header class="notes-header">
    <div class="notes-header__crumb">
      <a href="../index.html">From Sand to Superintelligence</a> &nbsp;·&nbsp; My notes
    </div>
    <h1 class="notes-header__title">My Margin Notes</h1>
    <p class="notes-header__dek">All notes you've left across the 42 chapters. Click any note to jump to its paragraph.</p>
  </header>

  <div class="notes-toolbar">
    <div class="notes-filters">
      <button class="notes-filter notes-filter--active" data-filter="all" type="button">All</button>
      <button class="notes-filter" data-filter="question" type="button">❓ Question</button>
      <button class="notes-filter" data-filter="analogy"  type="button">💡 Analogy</button>
      <button class="notes-filter" data-filter="stuck"    type="button">😤 Stuck-on</button>
      <button class="notes-filter" data-filter="got-it"   type="button">✅ Got-it</button>
    </div>
    <div style="display:flex;align-items:center;gap:var(--space-4);">
      <span class="notes-count" id="notes-count"></span>
      <button class="notes-export" id="notes-export-btn" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Markdown
      </button>
    </div>
  </div>

  <div id="notes-content">
    <!-- Populated by JS -->
    <div class="notes-empty" id="notes-loading">
      <div class="notes-empty__icon">📝</div>
      <p class="notes-empty__title">Loading notes…</p>
    </div>
  </div>
</main>

<script src="../js/app.js" defer></script>
<script>
(function () {
  'use strict';

  // Chapter order mirrors template.py CHAPTERS list
  const CHAPTER_ORDER = [
    {num:"01",slug:"01-quartz",title:"The Mineral"},
    {num:"02",slug:"02-fire-and-carbon",title:"Fire and Carbon"},
    {num:"03",slug:"03-nine-nines",title:"The Nine-Nines Problem"},
    {num:"04",slug:"04-czochralski",title:"Growing a Perfect Crystal"},
    {num:"05",slug:"05-wafers",title:"From Log to Mirror"},
    {num:"06",slug:"06-design",title:"Designing the Impossible"},
    {num:"07",slug:"07-deposition",title:"Painting with Atoms"},
    {num:"08",slug:"08-euv",title:"Light at 13.5 Nanometers"},
    {num:"09",slug:"09-etch-and-implant",title:"Carving and Doping"},
    {num:"10",slug:"10-interconnects",title:"The Wiring Sky"},
    {num:"11",slug:"11-test-and-dice",title:"Test and Dice"},
    {num:"12",slug:"12-cowos-hbm",title:"CoWoS and the 2.5D Revolution"},
    {num:"13",slug:"13-vera-rubin-superchip",title:"The Vera Rubin Superchip"},
    {num:"14",slug:"14-nvl72",title:"The NVL72 Rack"},
    {num:"15",slug:"15-burn-in",title:"Burn-In and Reliability"},
    {num:"16",slug:"16-ai-factory",title:"The AI Factory"},
    {num:"17",slug:"17-electron-choice",title:"The Electron's Choice"},
    {num:"18",slug:"18-transistor-valve",title:"The Transistor as a Valve"},
    {num:"19",slug:"19-switch-to-logic",title:"From Switch to Logic"},
    {num:"20",slug:"20-adder-and-memory",title:"Adders, Latches, Memory"},
    {num:"21",slug:"21-the-clock",title:"The Clock"},
    {num:"22",slug:"22-fetch-decode-execute",title:"Fetch, Decode, Execute"},
    {num:"23",slug:"23-isa",title:"From Transistors to ISA"},
    {num:"24",slug:"24-memory-pyramid",title:"Memory's Pyramid"},
    {num:"25",slug:"25-boot",title:"Boot"},
    {num:"26",slug:"26-os-conductor",title:"The OS as Conductor"},
    {num:"27",slug:"27-compilers",title:"The Translation Stack"},
    {num:"28",slug:"28-gpu-mind",title:"The GPU's Different Mind"},
    {num:"29",slug:"29-network-in-numbers",title:"A Neural Network Lives in Numbers"},
    {num:"30",slug:"30-one-thought",title:"A Thought, Token by Token"},
    {num:"31",slug:"31-second-wire",title:"The Second Wire"},
    {num:"32",slug:"32-tokens-on-wire",title:"Tokens on the Wire"},
    {num:"33",slug:"33-latency",title:"Latency Is Cognition"},
    {num:"34",slug:"34-agents",title:"Agents"},
    {num:"35",slug:"35-swarm",title:"Swarm"},
    {num:"36",slug:"36-protocols",title:"Protocols of Trust"},
    {num:"37",slug:"37-memory-commons",title:"The Memory Commons"},
    {num:"38",slug:"38-browser-worker",title:"The Browser Becomes the Worker"},
    {num:"39",slug:"39-markets-of-models",title:"Markets of Models"},
    {num:"40",slug:"40-compounding",title:"The Compounding"},
    {num:"41",slug:"41-value-reroutes",title:"Where Value Reroutes"},
    {num:"42",slug:"42-loom",title:"The Loom"},
  ];

  const TYPE_ICONS = {question:'❓', analogy:'💡', stuck:'😤', 'got-it':'✅'};
  const TYPE_LABELS = {question:'Question', analogy:'Analogy', stuck:'Stuck-on', 'got-it':'Got-it'};

  let allNotes = {};  // slug → notes[]
  let activeFilter = 'all';

  function loadAll() {
    const result = {};
    CHAPTER_ORDER.forEach(ch => {
      const key = `fsts.notes.${ch.slug}`;
      try {
        const raw = localStorage.getItem(key);
        if (raw) result[ch.slug] = JSON.parse(raw);
      } catch (_) {}
    });
    return result;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function render() {
    const content = document.getElementById('notes-content');
    const countEl = document.getElementById('notes-count');
    allNotes = loadAll();

    // Gather chapters that have matching notes
    const chapters = [];
    let totalVisible = 0;

    CHAPTER_ORDER.forEach(ch => {
      const chNotes = (allNotes[ch.slug] || []).filter(n =>
        activeFilter === 'all' || n.type === activeFilter
      );
      if (chNotes.length > 0) {
        chapters.push({ ch, notes: chNotes });
        totalVisible += chNotes.length;
      }
    });

    countEl.textContent = totalVisible
      ? `${totalVisible} note${totalVisible !== 1 ? 's' : ''}`
      : '';

    if (totalVisible === 0) {
      const totalAll = Object.values(allNotes).reduce((s, a) => s + a.length, 0);
      content.innerHTML = emptyStateHtml(totalAll, activeFilter);
      return;
    }

    const html = chapters.map(({ ch, notes }) => {
      const noteCards = notes.map(note => noteCardHtml(ch, note)).join('');
      return `<section class="notes-chapter">
        <div class="notes-chapter__heading">
          <span class="notes-chapter__num">Ch ${ch.num}</span>
          <h2 class="notes-chapter__title">${escHtml(ch.title)}</h2>
          <a class="notes-chapter__link" href="${ch.slug}.html">Read chapter →</a>
        </div>
        <div class="notes-list">${noteCards}</div>
      </section>`;
    }).join('');

    content.innerHTML = html;
  }

  function noteCardHtml(ch, note) {
    const icon = TYPE_ICONS[note.type] || '📝';
    const label = TYPE_LABELS[note.type] || note.type;
    const href = `${ch.slug}.html#${note.paraId}`;
    return `<a class="note-card" data-type="${escHtml(note.type)}" href="${escHtml(href)}">
      <span class="note-card__icon">${icon}</span>
      <div class="note-card__body">
        <div class="note-card__type">${escHtml(label)}</div>
        <p class="note-card__text">${escHtml(note.body)}</p>
        <div class="note-card__para">${escHtml(note.paraId)}</div>
      </div>
      <span class="note-card__jump">→</span>
    </a>`;
  }

  function emptyStateHtml(totalAll, filter) {
    if (totalAll === 0) {
      return `<div class="notes-empty">
        <div class="notes-empty__icon">✎</div>
        <p class="notes-empty__title">No notes yet</p>
        <p class="notes-empty__text">Hover any paragraph in a chapter and click ✎ to add your first margin note.</p>
        <a class="notes-empty__cta" href="01-quartz.html">Start Chapter 1 →</a>
      </div>`;
    }
    return `<div class="notes-empty">
      <div class="notes-empty__icon">🔍</div>
      <p class="notes-empty__title">No ${filter} notes</p>
      <p class="notes-empty__text">You have ${totalAll} note${totalAll !== 1 ? 's' : ''} across your chapters, but none of type "${filter}".</p>
    </div>`;
  }

  // ── Filter buttons ─────────────────────────────────────────────────────────
  document.querySelectorAll('.notes-filter').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.notes-filter').forEach(b => b.classList.remove('notes-filter--active'));
      btn.classList.add('notes-filter--active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  // ── Markdown export ────────────────────────────────────────────────────────
  document.getElementById('notes-export-btn').addEventListener('click', () => {
    const all = loadAll();
    const lines = ['# My Margin Notes — From Sand to Superintelligence', ''];

    CHAPTER_ORDER.forEach(ch => {
      const notes = all[ch.slug] || [];
      if (!notes.length) return;

      lines.push(`## Chapter ${ch.num}: ${ch.title}`);
      lines.push('');

      const byType = {};
      notes.forEach(n => {
        (byType[n.type] = byType[n.type] || []).push(n);
      });

      Object.entries(byType).forEach(([type, typeNotes]) => {
        const label = TYPE_LABELS[type] || type;
        lines.push(`### ${TYPE_ICONS[type] || ''} ${label}`);
        lines.push('');
        typeNotes.forEach(n => {
          lines.push(`- **${label}** (${n.paraId})`);
          lines.push(`  > ${n.body.replace(/\n/g, '\n  > ')}`);
          lines.push('');
        });
      });
    });

    const md = lines.join('\n');
    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sand-to-superintelligence-notes.md';
    a.click();
    URL.revokeObjectURL(url);
  });

  // ── Initial render ──────────────────────────────────────────────────────────
  render();
})();
</script>
</body>
</html>
